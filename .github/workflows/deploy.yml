name: Deploy CDK (Backend)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2

      - name: Build backend Lambda package
        run: |
          cd backend
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew buildLambda
          else
            gradle buildLambda
          fi

      - name: Deploy CDK backend stacks
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STACK_SUFFIX: ${{ secrets.STACK_SUFFIX || '' }}
          MODEL_OBJECT_KEY: ${{ secrets.MODEL_OBJECT_KEY || '' }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ACCOUNT_ID: ${{ secrets.REACT_APP_ACCOUNT_ID }}
          REACT_APP_API_ID: ${{ secrets.REACT_APP_API_ID }}
          REACT_APP_API_REGION: ${{ secrets.REACT_APP_API_REGION }}
          REACT_APP_API_STAGE: ${{ secrets.REACT_APP_API_STAGE }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || '' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID || '' }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN || '' }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER || '' }}
        run: |
          cd cdk
          echo "Deploying backend/CDK stacks..."
          cdk deploy --all --require-approval never
