name: Deploy CDK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        # Pull the repository contents for the workflow run.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
        # Ensure the GitHub runner has a Node runtime for CDK + frontend builds.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
        # Assume the IAM role used for CDK deployments within this workflow.

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2
        # Install the CDK toolkit so the runner can synth/deploy stacks.

      # Build backend Lambda package
      - name: Build Lambda package
        run: |
          cd backend
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew buildLambda
          else
            gradle buildLambda
          fi
        # Compile the backend JAR that SageMaker/Lambda expects.
      
       # Build the React frontend
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        # Produce a production-ready React build before CDK deployment.

      - name: Deploy CDK
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STACK_SUFFIX: ${{ secrets.STACK_SUFFIX || '' }}
          MODEL_OBJECT_KEY: ${{ secrets.MODEL_OBJECT_KEY || '' }}
        run: |
          cd cdk
          cdk deploy --all --require-approval never
        # Deploy every stack without interactive approval (safe in CI).
