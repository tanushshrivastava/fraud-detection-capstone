name: Deploy Frontend

on:
  workflow_dispatch:  # Only runs when manually triggered from GitHub Actions tab

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2

      - name: Build frontend (Expo)
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_ID: ${{ secrets.REACT_APP_API_ID }}
          REACT_APP_API_REGION: ${{ secrets.REACT_APP_API_REGION }}
          REACT_APP_API_STAGE: ${{ secrets.REACT_APP_API_STAGE }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          echo "Front-end build using API https://${REACT_APP_API_ID}.execute-api.${REACT_APP_API_REGION}.amazonaws.com/${REACT_APP_API_STAGE}"
          echo "Deploying with account ${AWS_ACCOUNT_ID}"
          npm ci
          npm run export

      - name: Build public web frontend assets
        working-directory: frontend-web
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ACCOUNT_ID: ${{ secrets.REACT_APP_ACCOUNT_ID }}
          REACT_APP_API_ID: ${{ secrets.REACT_APP_API_ID }}
          REACT_APP_API_REGION: ${{ secrets.REACT_APP_API_REGION }}
          REACT_APP_API_STAGE: ${{ secrets.REACT_APP_API_STAGE }}
        run: |
          npm ci
          npm run build

      - name: Deploy frontend stack
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STACK_SUFFIX: ${{ secrets.STACK_SUFFIX || '' }}
        run: |
          cd cdk
          FRONT_STACK="FraudFrontendStack${STACK_SUFFIX:+-$STACK_SUFFIX}"
          WEB_STACK="FraudWebFrontendStack${STACK_SUFFIX:+-$STACK_SUFFIX}"
          cdk deploy "$FRONT_STACK" "$WEB_STACK" --require-approval never
