name: Deploy Frontend

on:
  workflow_dispatch:  # still allows manual runs
  push:
    branches: [ main ]
    
jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        # Retrieve repository contents for the deployment run.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
        # Match the Node runtime used by the React build.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
        # Authenticate against AWS via OIDC for the remainder of the workflow.

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2
        # Install CDK to reuse the infrastructure code for the frontend stack.

      - name: Build frontend
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_API_ID: ${{ secrets.REACT_APP_API_ID }}
          REACT_APP_API_REGION: ${{ secrets.REACT_APP_API_REGION }}
          REACT_APP_API_STAGE: ${{ secrets.REACT_APP_API_STAGE }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          cd frontend
          echo "Front-end build using API https://${REACT_APP_API_ID}.execute-api.${REACT_APP_API_REGION}.amazonaws.com/${REACT_APP_API_STAGE}"
          echo "Deploying with account ${AWS_ACCOUNT_ID}"
          npm ci
          npm run export
        # Create the production build artifact and surface which API it targets.

      - name: Deploy frontend stack
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STACK_SUFFIX: ${{ secrets.STACK_SUFFIX || '' }}
        run: |
          cd cdk
          STACK_NAME="FraudFrontendStack${STACK_SUFFIX:+-$STACK_SUFFIX}"
          cdk deploy "$STACK_NAME" --require-approval never
        # Deploy only the frontend stack to minimize blast radius for UI-only changes.
